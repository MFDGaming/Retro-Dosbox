name: Build unsigned Android APK

# Produces an unsigned release APK for testing, sideloading (after manual
# signing), or external distribution pipelines.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  apk:
    name: Unsigned release APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # The core is a submodule and the APK is worthless without it: an
          # APK with no libretrodos.so installs, starts, and cannot run a game.
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the core
        run: |
          # The NDK version is pinned in app/build.gradle.kts; install the same
          # one rather than whatever the image ships with.
          ANDROID_NDK="$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          if [ ! -d "$ANDROID_NDK" ]; then
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
              --install "ndk;28.2.13676358"
          fi
          export ANDROID_NDK
          cd android && ./build-core.sh

      - name: Build unsigned release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Verify APK and native core
        run: |
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "APK: $APK"
          test -n "$APK"
          unzip -l "$APK" | grep -q "libretrodos.so" || { echo "Error: libretrodos.so missing from APK"; exit 1; }

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: retro-dos-release-unsigned-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
